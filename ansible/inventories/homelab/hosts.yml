---
# Ansible inventory for services/x64
# Source of truth: services/x64/<service>/*.conf
#
# This inventory describes the current Proxmox service definitions.
# VMIDs are retained as metadata for migration planning; they are not ESXi IDs.
# Configure ansible_host for guests whose IP is not declared in their service
# configuration after DHCP reservation or static addressing is configured.

all:
  children:
    virtualization:
      children:
        proxmox_guests:
          children:
            network:
              hosts:
                opnsense:
                  vmid: 200
                  service_config: services/x64/opnsense/200.conf
                  guest_type: qemu
                  guest_os: OPNsense
                  vcpu: 1
                  memory_mb: 1024
                  autostart: true
                  role: firewall_router
                  ansible_connection: httpapi
                  # OPNsense API/SSH management address is not defined in 200.conf.
                  # ansible_host: <management-ip>

            active_directory:
              children:
                domain_controllers:
                  hosts:
                    dc:
                      vmid: 400
                      service_config: services/x64/dc/400.conf
                      guest_type: qemu
                      guest_os: Windows Server 2022
                      vcpu: 2
                      memory_mb: 4096
                      role: active_directory_domain_controller
                      # No guest IP is defined in 400.conf.
                      # ansible_host: <dc-ip>
                      ansible_connection: winrm
                      ansible_winrm_transport: ntlm
                      ansible_port: 5986
                      ansible_winrm_server_cert_validation: ignore
                member_servers:
                  hosts:
                    sv1:
                      vmid: 401
                      service_config: services/x64/sv1/401.conf
                      guest_type: qemu
                      guest_os: Windows Server 2016
                      vcpu: 2
                      memory_mb: 3072
                      role: active_directory_member_server
                      # No guest IP is defined in 401.conf.
                      # ansible_host: <sv1-ip>
                      ansible_connection: winrm
                      ansible_winrm_transport: ntlm
                      ansible_port: 5986
                      ansible_winrm_server_cert_validation: ignore
                    sv2:
                      vmid: 402
                      service_config: services/x64/sv2/402.conf
                      guest_type: qemu
                      guest_os: Windows Server 2012 R2
                      vcpu: 2
                      memory_mb: 1024
                      role: active_directory_member_server
                      # No guest IP is defined in 402.conf.
                      # ansible_host: <sv2-ip>
                      ansible_connection: winrm
                      ansible_winrm_transport: ntlm
                      ansible_port: 5986
                      ansible_winrm_server_cert_validation: ignore
                clients:
                  hosts:
                    client:
                      vmid: 403
                      service_config: services/x64/client/403.conf
                      guest_type: qemu
                      guest_os: Windows 10
                      vcpu: 2
                      memory_mb: 2560
                      role: active_directory_client
                      # No guest IP is defined in 403.conf.
                      # ansible_host: <client-ip>
                      ansible_connection: winrm
                      ansible_winrm_transport: ntlm
                      ansible_port: 5986
                      ansible_winrm_server_cert_validation: ignore

            iot:
              children:
                home_automation:
                  hosts:
                    homeassistant:
                      ansible_host: 192.168.1.10
                      vmid: 100
                      service_config: services/x64/homeassistant/100.conf
                      guest_type: lxc
                      guest_os: Alpine Linux
                      vcpu: 1
                      memory_mb: 1024
                      autostart: true
                      role: home_assistant
                      service_port: 8123
                      ansible_user: root
                mqtt:
                  hosts:
                    mosquitto:
                      ansible_host: 192.168.1.18
                      vmid: 101
                      service_config: services/x64/mosquitto/101.conf
                      guest_type: lxc
                      guest_os: Alpine Linux
                      vcpu: 1
                      memory_mb: 96
                      autostart: false
                      role: mqtt_broker
                      service_port: 1883
                      ansible_user: root
                device_management:
                  hosts:
                    esphome:
                      ansible_host: 192.168.1.108
                      vmid: 108
                      service_config: services/x64/esphome/108.conf
                      guest_type: lxc
                      guest_os: Ubuntu
                      vcpu: 2
                      memory_mb: 1536
                      autostart: false
                      role: esphome_device_manager
                      ansible_user: root

            cybersecurity:
              children:
                siem:
                  hosts:
                    wazuh:
                      ansible_host: 192.168.1.240
                      vmid: 106
                      service_config: services/x64/wazuh/106.conf
                      guest_type: lxc
                      guest_os: Ubuntu
                      vcpu: 4
                      memory_mb: 4096
                      autostart: true
                      role: siem_xdr
                      ansible_user: root
                      wazuh_api_port: 55000
                      wazuh_agent_port: 1514
                      wazuh_enrollment_port: 1515
                security_workstations:
                  hosts:
                    parrot:
                      vmid: 300
                      service_config: services/x64/parrot/300.conf
                      guest_type: qemu
                      guest_os: Parrot Security OS
                      vcpu: 1
                      memory_mb: 1536
                      role: security_testing_workstation
                      # No guest IP is defined in 300.conf.
                      # ansible_host: <parrot-ip>
                      ansible_user: user
                malware_analysis:
                  hosts:
                    sandbox:
                      vmid: 301
                      service_config: services/x64/sandbox/301.conf
                      guest_type: qemu
                      guest_os: Windows 10
                      vcpu: 2
                      memory_mb: 2560
                      role: isolated_analysis_sandbox
                      # No guest IP is defined in 301.conf.
                      # ansible_host: <sandbox-ip>
                      ansible_connection: winrm
                      ansible_winrm_transport: ntlm
                      ansible_port: 5986
                      ansible_winrm_server_cert_validation: ignore

    observability:
      hosts:
        monitoring:
          ansible_host: 192.168.1.121
          vmid: 104
          service_config: services/x64/monitoring/104.conf
          guest_type: lxc
          guest_os: Alpine Linux
          vcpu: 1
          memory_mb: 256
          autostart: false
          role: metrics_and_logging
          ansible_user: root
          prometheus_port: 9090
          grafana_port: 3000
          loki_port: 3100

  vars:
    ansible_python_interpreter: auto_silent

# Notes:
# - monitoring/docker-compose.yml currently contains a Grafana admin password
#   in plaintext. Move it to Ansible Vault or an environment secret before use.
# - OPNsense management connectivity may require a dedicated API collection or
#   SSH configuration; httpapi is a placeholder until that is implemented.
# - WinRM must be enabled and configured inside each Windows guest before use.
# - Proxmox .conf files provide static IPs only for LXC guests listed above.
